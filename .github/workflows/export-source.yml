name: Export Chess Titans Android Source

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - name: Download source parts from release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p parts source
          gh release download Port \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "ChessTitansAndroid_CloudBuildReady.part*" \
            --dir parts
          ls -lh parts
          cat parts/ChessTitansAndroid_CloudBuildReady.part* > source.zip
          unzip -q source.zip -d source
          test -d source/ChessTitansAndroid || find source -maxdepth 3 -type d

      - name: Upload extracted source
        uses: actions/upload-artifact@v4
        with:
          name: ChessTitansAndroid-Source
          path: source/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
