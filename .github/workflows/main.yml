name: Build Chess Titans APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download release parts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p parts
          gh release download Port \
            --repo "$GITHUB_REPOSITORY" \
            --dir parts
          ls -lh parts
          cat parts/ChessTitansAndroid_CloudBuildReady.part* > source.zip
          unzip -q source.zip -d source

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Fix Java Kotlin compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("source/ChessTitansAndroid/app/build.gradle")
          if not p.exists():
              print("ERROR: app/build.gradle not found")
              exit(1)

          s = p.read_text()
          s = s.replace("VERSION_1_8", "VERSION_17")
          s = s.replace("VERSION_8", "VERSION_17")
          p.write_text(s)

          print("Updated Java compatibility settings:")
          print(p.read_text())
          PY

      - name: Build APK
        run: |
          cd source/ChessTitansAndroid
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChessTitans-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
          
