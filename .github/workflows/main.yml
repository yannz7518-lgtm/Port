name: Build Chess Titans APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout patch scripts
        uses: actions/checkout@v4

      - name: Download release parts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p parts
          gh release download Port \
            --repo "$GITHUB_REPOSITORY" \
            --dir parts
          ls -lh parts
          cat parts/ChessTitansAndroid_CloudBuildReady.part* > source.zip
          unzip -q source.zip -d source

      - name: Apply 3D gameplay and fidelity patch
        run: python3 .github/scripts/patch_3d_port.py

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Force Java 17
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("source/ChessTitansAndroid/app/build.gradle")
          s = p.read_text()

          s = re.sub(
              r'(?m)^(\s*sourceCompatibility\s*=?\s*).*$', 
              r'\1JavaVersion.VERSION_17',
              s
          )

          s = re.sub(
              r'(?m)^(\s*targetCompatibility\s*=?\s*).*$', 
              r'\1JavaVersion.VERSION_17',
              s
          )

          s = s.replace("VERSION_1_8", "VERSION_17")

          if "compileOptions" not in s:
              s = s.replace(
                  "android {",
                  """android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          """,
                  1
              )

          s += """

          tasks.withType(JavaCompile).configureEach {
              sourceCompatibility = '17'
              targetCompatibility = '17'
          }
          """

          p.write_text(s)
          print("Java target forced to 17")
          PY
      - name: Build APK
        run: |
          cd source/ChessTitansAndroid
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChessTitans-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
          retention-days: 7
