name: Build Chess Titans APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download release parts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p parts
          gh release download Port \
            --repo "$GITHUB_REPOSITORY" \
            --dir parts
          ls -lh parts
          cat parts/ChessTitansAndroid_CloudBuildReady.part* > source.zip
          unzip -q source.zip -d source

      - name: Keep AI updates on the OpenGL render thread
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("source/ChessTitansAndroid/app/src/main/java/com/example/chesstitans/render/ChessTitans3DRenderer.kt")
          s = p.read_text()
          nl = chr(10)
          s = s.replace("import android.os.Handler", "").replace("import android.os.Looper", "")
          s = re.sub(r"(?m)^\\s*private val mainHandler=Handler\\(Looper.getMainLooper\\(\\)\\)\\s*$", "    @Volatile private var pendingAiMove:Move?=null" + nl + "    @Volatile private var aiResultReady=false", s)
          s = s.replace("chess=Position(); history.clear(); aiThinking=false; syncPieces();", "chess=Position(); history.clear(); aiThinking=false; pendingAiMove=null; aiResultReady=false; syncPieces();")
          old = "if(!chess.white&&legal.isNotEmpty()){aiThinking=true;Thread{val cp=chess.copy();val moves=cp.legal();val choice=if(moves.isNotEmpty())Engine.choose(cp,moves,2)else null;mainHandler.post{if(aiThinking&&choice!=null){applyMove(choice)};aiThinking=false}}.start()}"
          new = "if(!chess.white&&legal.isNotEmpty()){aiThinking=true;val snapshot=chess.copy();Thread{val moves=snapshot.legal();pendingAiMove=if(moves.isNotEmpty())Engine.choose(snapshot,moves,2)else null;aiResultReady=true}.start()}"
          if old in s:
              s = s.replace(old, new, 1)
          if "pendingAiMove:Move?" not in s:
              hist = "    private val history=mutableListOf<Position>()"
              if hist not in s: raise SystemExit("history declaration missing")
              s = s.replace(hist, hist + nl + "    @Volatile private var pendingAiMove:Move?=null" + nl + "    @Volatile private var aiResultReady=false", 1)
          draw = re.search(r"(?m)^\\s*override fun onDrawFrame\\(gl: GL10\\?\\)\\s*\\{", s)
          if not draw: raise SystemExit("onDrawFrame declaration not found")
          poll = "        if(aiResultReady){aiResultReady=false;val move=pendingAiMove;pendingAiMove=null;if(aiThinking&&move!=null&&!chess.white&&chess.legal().any{it==move})applyMove(move);aiThinking=false}" + nl
          if "if(aiResultReady)" not in s:
              s = s[:draw.end()] + nl + poll + s[draw.end():]
          s = s.replace("aiThinking=false;", "aiThinking=false;pendingAiMove=null;aiResultReady=false;")
          if "if(aiResultReady)" not in s or "pendingAiMove:Move?" not in s:
              raise SystemExit("render-thread AI patch validation failed")
          p.write_text(s)
          print("Render-thread AI patch applied and validated.")
          PY

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Force Java 17
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("source/ChessTitansAndroid/app/build.gradle")
          s = p.read_text()

          s = re.sub(
              r'(?m)^(\s*sourceCompatibility\s*=?\s*).*$', 
              r'\1JavaVersion.VERSION_17',
              s
          )

          s = re.sub(
              r'(?m)^(\s*targetCompatibility\s*=?\s*).*$', 
              r'\1JavaVersion.VERSION_17',
              s
          )

          s = s.replace("VERSION_1_8", "VERSION_17")

          if "compileOptions" not in s:
              s = s.replace(
                  "android {",
                  """android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          """,
                  1
              )

          s += """

          tasks.withType(JavaCompile).configureEach {
              sourceCompatibility = '17'
              targetCompatibility = '17'
          }
          """

          p.write_text(s)
          print("Java target forced to 17")
          PY
      - name: Build APK
        run: |
          cd source/ChessTitansAndroid
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChessTitans-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
          retention-days: 7
